<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 | Basic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ease-expo-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      margin: 0;
      font-family: "Cormorant Garamond", "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
    }

    .browser-support-message {
      position: fixed;
      z-index: 100;
      bottom: 16px;
      left: 16px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.4;

      & p {
        margin: 0;
      }

      @supports (animation-trigger: --demo play-forwards) {
        display: none;
      }
    }

    .demo-content {
      & .spacer,
      & .demo {
        min-height: 100vh;
      }

      & .spacer {
        display: grid;
        place-items: center;
        background: #fff;

        & .scroll-cue {
          font-family: "Times New Roman", Times, serif;
          font-size: 96px;
          text-align: center;

          &::after {
            content: "";
            display: block;
            width: 20px;
            height: 20px;
            margin: 20px auto 0;
            border-right: 3px solid currentColor;
            border-bottom: 3px solid currentColor;
            rotate: 45deg;
          }
        }
      }

      & .demo {
        display: grid;
        place-items: center;
        background: #1a1a1a;

        & .target {
          color: #fff;
          font-size: 120px;
          font-weight: 500;
          text-align: center;
          opacity: 1;
          translate: 0 0;
          /* 要素全体が画面内に入ると有効化し、画面から完全に出ると無効化 */
          timeline-trigger: --target view() contain / cover;
          /* 通常の時間ベースのアニメーション */
          animation: motion 1s var(--ease-expo-out) both;
          /* トリガーの有効時は順再生、無効時は逆再生 */
          animation-trigger: --target play-forwards play-backwards;
        }
      }
    }

    /* 右からスライドしながらフェードインするキーフレーム */
    @keyframes motion {
      from {
        opacity: 0;
        translate: 100px 0;
      }
    }
  </style>
</head>
<body>
  <div class="browser-support-message">
    <p lang="ja">※Chrome・Edge 146以上で閲覧してください。</p>
    <p lang="en">※Please view this page in Chrome or Edge 146 or later.</p>
  </div>
  <div class="demo-content">
  <div class="spacer">
    <p class="scroll-cue">Scroll</p>
  </div>
  <main class="demo">
    <p class="target">Animation</p>
  </main>
  </div>
</body>
</html>
