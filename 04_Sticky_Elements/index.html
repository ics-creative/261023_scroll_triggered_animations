<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 | Sticky Elements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ease-expo-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ball-red: orangered;
      --ball-orange: orange;
      --ball-yellow: gold;
      --ball-green: seagreen;
      --ball-blue: royalblue;
      --text-yellow: goldenrod;
    }

    html,
    body {
      margin: 0;
    }

    body {
      background: #f5f5f5;
      color: #111;
      font-family: "Cormorant Garamond", "Times New Roman", Times, serif;
    }

    .browser-support-message {
      position: fixed;
      z-index: 100;
      bottom: 16px;
      left: 16px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.4;

      p {
        margin: 0;
      }

      @supports (animation-trigger: --demo play-forwards) {
        display: none;
      }
    }

    .demo-content {
      .layout {
        /* 画面が低いときは上下に12pxずつ余白を残す */
        --panel-height: min(454px, calc(100dvh - 24px));

        display: grid;
        justify-content: center;
        grid-template-columns: auto minmax(10rem, 18vw);
        column-gap: 2.5vw;

        /* -------------------------
           Left
        ------------------------- */
        .stage {
          position: sticky;
          top: 0;

          display: grid;
          place-items: center;

          height: 100dvh;

          .holes {
            display: grid;
            grid-template-columns: repeat(3, 100px);

            /* 画面高に応じて行間を縮め、飛び出すボールの空間を保つ */
            column-gap: 48px;
            align-content: space-between;

            height: var(--panel-height);
            padding: 88px 64px 56px;
            border-radius: 16px;
            background: #fff;

            .slot {
              position: relative;

              width: 100px;
              height: 30px;

              /*
               * 穴の手前側。
               *
               * 奥側とまったく同じ楕円を描き、
               * 下半分だけを切り出してボールの手前に重ねる。
               */
              &::after {
                content: "";

                position: absolute;
                z-index: 3;
                inset: 0;

                border-radius: 50%;
                background: #222;

                clip-path: inset(50% 0 0);
              }

              /*
               * 穴の奥側
               */
              .hole {
                position: absolute;
                z-index: 1;
                inset: 0;

                width: 100px;
                height: 30px;

                border-radius: 50%;
                background: #222;
              }

              /*
               * ボールの可動域。
               *
               * 下端を楕円の中心線（手前側のフチの上端）に合わせる。
               * ここは楕円がもっとも横に広がる線なので、
               * 切り取られたボールが楕円の外へはみ出すことがない。
               *
               * 穴の底に合わせると、下へ向かって細くなる楕円との間に
               * 隙間ができてボールの色が覗いてしまう。
               *
               * 穴の奥側より前、穴の手前側より後ろ。
               */
              .ball-clip {
                position: absolute;
                z-index: 2;
                inset: -160px 0 15px;

                overflow: clip;

                /*
                 * ボール
                 */
                .ball {
                  position: absolute;

                  left: 50%;
                  bottom: 0;

                  width: 72px;
                  aspect-ratio: 1;

                  border-radius: 50%;

                  /* フチより下＝ .ball-clip の外に隠れている状態 */
                  translate: -50% 80px;

                  /* 穴から飛び出し、落下して元の位置に戻る */
                  animation: appear 0.8s both;

                  /*
                   * animation ショートハンドは animation-trigger の指定を
                   * リセットするため、animation より後に指定する。
                   *
                   * replay は再生位置を先頭に戻してから再生するので、
                   * セクションを行き来するたびに頭から繰り返される。
                   */
                  &.ball--red {
                    background: var(--ball-red);

                    /* トリガーが有効になるたびに、頭から再生する */
                    animation-trigger: --red replay;
                  }

                  &.ball--orange {
                    background: var(--ball-orange);
                    animation-trigger: --orange replay;
                  }

                  &.ball--yellow {
                    background: var(--ball-yellow);
                    animation-trigger: --yellow replay;
                  }

                  &.ball--green {
                    background: var(--ball-green);
                    animation-trigger: --green replay;
                  }

                  &.ball--blue {
                    background: var(--ball-blue);
                    animation-trigger: --blue replay;
                  }
                }
              }
            }
          }
        }

        /* -------------------------
           Right
        ------------------------- */
        .stories-frame {
          align-self: center;
          height: var(--panel-height);
          overflow: clip;
          border-radius: 16px;
          background: #fff;
        }

        .stories {
          height: 100%;
          overflow-y: scroll;
          scrollbar-gutter: stable;
          overscroll-behavior-y: contain;
          background: #fff;

          &::-webkit-scrollbar {
            width: 20px;
          }

          &::-webkit-scrollbar-track {
            background: #eee;
          }

          &::-webkit-scrollbar-thumb {
            border: 3px solid #eee;
            border-radius: 100vh;
            background: #ccc;
          }

          .story {
            display: grid;
            place-items: center;

            min-height: 100%;

            h2 {
              margin: 0;
              font-size: 42px;
            }

            &.story--intro {
              h2 {
                &::after {
                  content: "";
                  display: block;
                  width: 20px;
                  height: 20px;
                  margin: 20px auto 0;
                  border-right: 2px solid currentColor;
                  border-bottom: 2px solid currentColor;
                  rotate: 45deg;
                }
              }
            }

            &.story--red {
              h2 {
                color: var(--ball-red);

                /* 色名が画面内に入ると、離れたボールを発火させる */
                timeline-trigger: --red view() contain / cover;
              }
            }

            &.story--orange {
              h2 {
                color: var(--ball-orange);
                timeline-trigger: --orange view() contain / cover;
              }
            }

            &.story--yellow {
              h2 {
                color: var(--text-yellow);
                timeline-trigger: --yellow view() contain / cover;
              }
            }

            &.story--green {
              h2 {
                color: var(--ball-green);
                timeline-trigger: --green view() contain / cover;
              }
            }

            &.story--blue {
              h2 {
                color: var(--ball-blue);
                timeline-trigger: --blue view() contain / cover;
              }
            }
          }
        }
      }
    }

    /* -------------------------
       Animation
    ------------------------- */

    /*
     * 穴から飛び出して、落下して戻る。
     * 上りは expo-out で減速し、下りは加速させて放物線にする。
     */
    @keyframes appear {
      0% {
        translate: -50% 80px;
        animation-timing-function: var(--ease-expo-out);
      }

      50% {
        translate: -50% -10px;
        animation-timing-function: cubic-bezier(0.7, 0, 0.8, 0);
      }

      100% {
        translate: -50% 80px;
      }
    }
  </style>
</head>

<body>

  <div class="browser-support-message">
    <p lang="ja">※Chrome・Edge 146以上で閲覧してください。</p>
    <p lang="en">* Please view this page in Chrome or Edge 146 or later.</p>
  </div>
  <div class="demo-content">
  <main class="layout">

    <div class="stage">

      <div class="holes">

        <div class="slot">
          <div class="hole"></div>
          <div class="ball-clip">
            <div class="ball ball--yellow"></div>
          </div>
        </div>

        <div class="slot">
          <div class="hole"></div>
        </div>

        <div class="slot">
          <div class="hole"></div>
          <div class="ball-clip">
            <div class="ball ball--orange"></div>
          </div>
        </div>

        <div class="slot">
          <div class="hole"></div>
        </div>

        <div class="slot">
          <div class="hole"></div>
          <div class="ball-clip">
            <div class="ball ball--red"></div>
          </div>
        </div>

        <div class="slot">
          <div class="hole"></div>
        </div>

        <div class="slot">
          <div class="hole"></div>
          <div class="ball-clip">
            <div class="ball ball--green"></div>
          </div>
        </div>

        <div class="slot">
          <div class="hole"></div>
        </div>

        <div class="slot">
          <div class="hole"></div>
          <div class="ball-clip">
            <div class="ball ball--blue"></div>
          </div>
        </div>

      </div>

    </div>


    <div class="stories-frame">
      <div class="stories">

        <section class="story story--intro">
          <h2>Scroll</h2>
        </section>

        <section class="story story--red">
          <h2>Red</h2>
        </section>

        <section class="story story--orange">
          <h2>Orange</h2>
        </section>

        <section class="story story--yellow">
          <h2>Yellow</h2>
        </section>

        <section class="story story--green">
          <h2>Green</h2>
        </section>

        <section class="story story--blue">
          <h2>Blue</h2>
        </section>

      </div>
    </div>

  </main>
  </div>

</body>
</html>
