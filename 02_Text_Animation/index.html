<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 | Text Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --paper: #fff;
      --ink: #222;
      --gutter: clamp(24px, 4vw, 64px);
      --ease-expo-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;

      &::-webkit-scrollbar {
        width: 32px;
      }

      &::-webkit-scrollbar-track {
        background: #f5f5f5;
      }

      &::-webkit-scrollbar-thumb {
        border: 3px solid #f5f5f5;
        border-radius: 100vh;
        background: #888;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Cormorant Garamond", "Times New Roman", Times, serif;
    }

    /* 未対応ブラウザ向けメッセージ */
    .browser-support-message {
      position: fixed;
      z-index: 100;
      bottom: 16px;
      left: 16px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.4;

      p {
        margin: 0;
      }

      @supports (animation-trigger: --demo play-forwards) {
        display: none;
      }
    }

    .demo-content {
      .spacer,
      .frame {
        min-height: 100vh;
      }

      .spacer {
        display: grid;
        place-items: center;
        background: #fff;

        .scroll-cue {
          font-size: 96px;
          text-align: center;

          &::after {
            content: "";
            display: block;
            width: 28px;
            height: 28px;
            margin: 20px auto 0;
            border-right: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            rotate: 45deg;
          }
        }
      }

      .frame {
        display: grid;
        place-items: center;
        padding: var(--gutter);
        background: #222;
        color: #fff;

        &.frame--paper {
          background: var(--paper);
          color: var(--ink);
        }

        .hero {
          /* 見出し全体が見えた位置でトリガーを有効化 */
          timeline-trigger: --title view() contain / cover;

          /* トリガーの参照範囲をこの要素内に限定 */
          trigger-scope: --title;

          .title {
            display: flex;
            justify-content: center;
            margin: 0;
            font-size: clamp(4.2rem, 14vw, 11rem);
          }

          /* 1文字ずつのマスク。下から立ち上がる */
          .char {
            display: block;
            overflow: clip;
            /* セリフやディセンダーのはみ出しを切らないよう余白を持たせる */
            padding-inline: 0.08em;
            padding-bottom: 0.15em;
            margin-inline: -0.04em;
            /* 兄弟順から遅延を計算し、内側のspanへ渡す */
            animation-delay: calc((sibling-index() - 1) * 0.05s);

            .char__inner {
              display: block;

              /* 1文字ずつ、下から立ち上がる */
              animation: rise 0.8s var(--ease-expo-out) both;
              animation-trigger: --title play-once;
              animation-delay: inherit;
            }
          }
        }
      }
    }

    @keyframes rise {
      from {
        translate: 0 100%;
      }
    }
  </style>
</head>
<body>
  <div class="browser-support-message">
    <p lang="ja">※Chrome・Edge 146以上で閲覧してください。</p>
    <p lang="en">* Please view this page in Chrome or Edge 146 or later.</p>
  </div>
  <div class="demo-content">
  <div class="spacer">
    <p class="scroll-cue">Scroll</p>
  </div>

  <section class="frame">
    <div class="hero">
      <h1 class="title" aria-label="Animation">
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">A</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">n</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">i</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">m</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">a</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">t</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">i</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">o</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">n</span></span>
      </h1>
    </div>
  </section>

  <section class="frame frame--paper">
    <div class="hero">
      <h1 class="title" aria-label="Trigger">
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">T</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">r</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">i</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">g</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">g</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">e</span></span>
        <span class="char" aria-hidden="true" translate="no"><span class="char__inner">r</span></span>
      </h1>
    </div>
  </section>
  </div>
</body>
</html>
